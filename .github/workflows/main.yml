name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # গিটহাবের লেটেস্ট রুল অনুযায়ী Node24 এনাবল করে দিচ্ছি
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.33 kivy requests pyjnius

    - name: Build with Buildozer
      run: |
        # আগের কোনো অবশিষ্টাংশ থাকলে ক্লিন করে নতুন বিল্ড শুরু করবে
        buildozer android clean
        yes | buildozer -v android debug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PhishGuard-APK
        path: bin/*.apk
