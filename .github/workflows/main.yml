name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        # libtinfo5 এর বদলে libtinfo6 এবং নতুন ভার্সনগুলো যোগ করা হয়েছে
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses6 libncursesw6 libtinfo6 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.33 kivy

    - name: Build with Buildozer
      run: |
        # ক্ল্লিন বিল্ড নিশ্চিত করা
        rm -rf .buildozer/
        yes | buildozer -v android debug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PhishGuard-APK
        path: bin/*.apk
